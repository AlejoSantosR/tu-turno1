name: Try repair carousel strip

on:
  push:
    paths:
      - '.github/workflows/try-repair-strip.yml'
  workflow_dispatch:

jobs:
  repair-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test repair candidates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          s=''.join(''.join(Path(f'assets/gallery/strip{i:02d}.txt').read_text().split()) for i in range(1,10))
          print('len',len(s),'mod4',len(s)%4)
          eq=[i for i,c in enumerate(s) if c=='=']
          print('equals count',len(eq),'positions',eq[:20], 'last chars',repr(s[-40:]))
          variants={}
          variants['orig_pad']=s + '='*((-len(s))%4)
          clean=s.replace('=','')
          variants['clean_stdpad']=clean + '='*((-len(clean))%4)
          for n in range(1,5):
              t=clean+('A'*n)
              variants[f'clean_A{n}']=t+'='*((-len(t))%4)
          for name,t in variants.items():
              try:
                  raw=base64.b64decode(t, validate=False)
                  p=Path('/tmp')/(name+'.jpg'); p.write_bytes(raw)
                  print(name,'chars',len(t),'bytes',len(raw),'SOI',raw[:2].hex(),'EOI',raw[-2:].hex())
              except Exception as e:
                  print(name,'ERROR',repr(e))
          PY
          for f in /tmp/*.jpg; do echo "--- $f"; file "$f"; done
