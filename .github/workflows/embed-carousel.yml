name: Embed carousel into HTML

on:
  push:
    paths:
      - '.github/workflows/embed-carousel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed carousel sprite in index.html
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          chunks = []
          for i in range(1, 10):
              p = Path(f'assets/gallery/strip{i:02d}.txt')
              chunks.append(''.join(p.read_text(encoding='utf-8').split()))
          image_b64 = ''.join(chunks)

          start = html.index('async function memories(){')
          end = html.index('function stars(){', start)

          replacement = """function memories(){
            const p=document.getElementById('photos');
            const src='data:image/jpeg;base64,""" + image_b64 + """';
            p.innerHTML='';
            const total=19;
            for(let loop=0;loop<2;loop++){
              for(let i=0;i<total;i++){
                let d=document.createElement('div');
                d.className='photo';
                d.style.backgroundImage='url("'+src+'")';
                d.style.backgroundSize=(total*100)+'% 100%';
                d.style.backgroundPosition=(i*100/(total-1))+'% center';
                p.appendChild(d);
              }
            }
          }
          """

          html = html[:start] + replacement + html[end:]
          index_path.write_text(html, encoding='utf-8')

      - name: Commit embedded carousel
        run: |
          if git diff --quiet -- index.html; then
            echo "Nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inline waiting-page carousel images"
          git push
