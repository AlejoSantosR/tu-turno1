name: Repair and embed carousel final

on:
  push:
    paths:
      - '.github/workflows/repair-carousel-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JPEG and embed directly in HTML
        shell: python
        run: |
          from pathlib import Path
          import base64, re

          # Rebuild the stored 19-photo strip.
          s=''.join(''.join(Path(f'assets/gallery/strip{i:02d}.txt').read_text().split()) for i in range(1,10))
          clean=s.replace('=','')
          # The source lost its final Base64 character. Add one byte-alignment character,
          # decode, then restore the canonical JPEG EOI marker.
          t=clean+'A'
          t += '='*((-len(t))%4)
          raw=bytearray(base64.b64decode(t, validate=True))
          if not raw.startswith(b'\xff\xd8'):
              raise RuntimeError('Rebuilt strip does not start as JPEG')
          raw[-2:]=b'\xff\xd9'
          if not raw.endswith(b'\xff\xd9'):
              raise RuntimeError('Unable to repair JPEG end marker')
          image_b64=base64.b64encode(bytes(raw)).decode('ascii')

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')

          # Strong, browser-safe strip rendering. Two identical inline images make the loop seamless.
          extra_css='''\n.memory-strip{height:248px;width:auto;display:block;flex:0 0 auto;border-radius:20px;box-shadow:0 12px 25px #0005;border:2px solid #ffffff2e;background:#061528}.memory-strip:first-child{border-color:#ff9b316f}.memory-strip:last-child{border-color:#2f9cff70}@media(max-width:520px){.memory-strip{height:190px}}\n'''
          html=html.replace('</style>',extra_css+'</style>',1)

          start=html.index('function memories(){')
          end=html.index('function stars(){',start)
          replacement="""function memories(){
            const p=document.getElementById('photos');
            const src='data:image/jpeg;base64,"""+image_b64+"""';
            p.innerHTML='';
            for(let i=0;i<2;i++){
              const img=document.createElement('img');
              img.className='memory-strip';
              img.src=src;
              img.alt='Nuestros recuerdos';
              img.decoding='sync';
              img.loading='eager';
              p.appendChild(img);
            }
          }
          """
          html=html[:start]+replacement+html[end:]
          index.write_text(html,encoding='utf-8')

          print('Repaired JPEG bytes:',len(raw))
          print('Embedded Base64 chars:',len(image_b64))
          print('JPEG markers:',bytes(raw[:2]).hex(),bytes(raw[-2:]).hex())
      - name: Commit repaired carousel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair inline waiting-page carousel JPEG"
          git push
